<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="optionsPageTitle">arXiv Save as Title settings</title>
  <style>
    * { box-sizing: border-box; }
    body { width: 390px; margin: 0; padding: 20px; color: #171717; background: #fff; font: 14px/1.45 system-ui, -apple-system, sans-serif; }
    h1 { margin: 0 0 4px; font-size: 21px; letter-spacing: -.4px; }
    .hint { margin: 0 0 20px; color: #737373; }
    fieldset { min-width: 0; margin: 0 0 20px; padding: 0; border: 0; }
    [hidden] { display: none !important; }
    legend { margin-bottom: 9px; padding: 0; font-size: 14px; font-weight: 750; }
    .choices { display: grid; gap: 8px; }
    .format-choices { grid-template-columns: 1fr 1fr; }
    .author-choices { grid-template-columns: 1fr 1fr; }
    .bracket-choices { grid-template-columns: repeat(3, 1fr); }
    .choice-wide { grid-column: 1 / -1; }
    .choice { position: relative; display: block; cursor: pointer; }
    .choice input { position: absolute; opacity: 0; pointer-events: none; }
    .choice span { display: flex; min-height: 42px; align-items: center; justify-content: center; padding: 8px 10px; border: 1px solid #d4d4d4; border-radius: 9px; background: #fafafa; color: #404040; font-weight: 600; text-align: center; transition: border-color .15s, background .15s, color .15s, box-shadow .15s; }
    .choice input:checked + span { border-color: #278443; background: #eef8f0; color: #176b32; box-shadow: 0 0 0 1px #278443; }
    .choice input:focus-visible + span { outline: 2px solid #1a73e8; outline-offset: 2px; }
    .preview { margin: 2px 0 18px; padding: 13px 14px; border: 1px solid #e5e5e5; border-radius: 10px; background: #f5f5f5; overflow-wrap: anywhere; }
    .preview strong { display: block; margin-bottom: 4px; font-size: 13px; color: #525252; }
    #preview { font: 13px ui-monospace, SFMono-Regular, monospace; color: #171717; }
    .save-location { display: flex; align-items: center; gap: 8px; margin: 0 0 18px; cursor: pointer; }
    .save-location input { width: 17px; height: 17px; accent-color: #278443; }
    .save-row { display: flex; align-items: center; gap: 10px; }
    #save { padding: 9px 14px; color: #fff; background: #278443; border: 0; border-radius: 8px; font-weight: 750; cursor: pointer; }
    #save:hover { background: #1f7037; }
    #save:focus-visible, .save-location input:focus-visible { outline: 3px solid #1a73e8; outline-offset: 3px; }
    #save:disabled { cursor: wait; opacity: .7; }
    #status { min-height: 20px; color: #278443; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      body { color: #f5f5f5; background: #171717; }
      .hint { color: #bdbdbd; }
      .choice span { border-color: #616161; background: #262626; color: #ededed; }
      .choice input:checked + span { border-color: #65c47e; background: #173d24; color: #b8f0c6; box-shadow: 0 0 0 1px #65c47e; }
      .preview { border-color: #525252; background: #262626; }
      .preview strong, #preview { color: #ededed; }
      #status { color: #75d48e; }
    }
    @media (prefers-reduced-motion: reduce) { .choice span { transition: none; } }
  </style>
</head>
<body>
  <h1 data-i18n="heading">Paper PDF filename settings</h1>
  <p class="hint" data-i18n="hint">Choose the filename order and author display.</p>

  <fieldset>
    <legend data-i18n="language">Language</legend>
    <div class="choices bracket-choices">
      <label class="choice"><input type="radio" name="language" value="auto"><span data-i18n="languageAuto">Auto</span></label>
      <label class="choice"><input type="radio" name="language" value="en"><span>English</span></label>
      <label class="choice"><input type="radio" name="language" value="ko"><span>한국어</span></label>
    </div>
  </fieldset>

  <fieldset>
    <legend data-i18n="filenameFormat">Filename format</legend>
    <div class="choices format-choices">
      <label class="choice"><input type="radio" name="filenameTemplate" value="{author}_{year}_{title}"><span data-i18n="formatAuthorYearTitle">Author · Year · Title</span></label>
      <label class="choice"><input type="radio" name="filenameTemplate" value="{title}_{author}_{year}"><span data-i18n="formatTitleAuthorYear">Title · Author · Year</span></label>
      <label class="choice"><input type="radio" name="filenameTemplate" value="{year}_{author}_{title}"><span data-i18n="formatYearAuthorTitle">Year · Author · Title</span></label>
      <label class="choice"><input type="radio" name="filenameTemplate" value="{title}"><span data-i18n="formatTitleOnly">Title only</span></label>
      <label class="choice choice-wide"><input type="radio" name="filenameTemplate" value="{bracketOpen}{author}{year}{bracketClose} {title}"><span data-i18n="formatGrouped">(Author Year) Title</span></label>
    </div>
  </fieldset>

  <fieldset id="bracketOptions" hidden>
    <legend data-i18n="bracketStyle">Grouping symbol</legend>
    <div class="choices bracket-choices">
      <label class="choice"><input type="radio" name="bracketStyle" value="parentheses"><span data-i18n="parentheses">( ) Parentheses</span></label>
      <label class="choice"><input type="radio" name="bracketStyle" value="square"><span data-i18n="squareBrackets">[ ] Square</span></label>
      <label class="choice"><input type="radio" name="bracketStyle" value="curly"><span data-i18n="curlyBrackets">{ } Curly</span></label>
    </div>
  </fieldset>

  <fieldset id="authorOptions">
    <legend data-i18n="authorDisplay">Author display</legend>
    <div class="choices author-choices">
      <label class="choice"><input type="radio" name="authorNameFormat" value="last"><span>Last Name</span></label>
      <label class="choice"><input type="radio" name="authorNameFormat" value="full"><span>Full Name</span></label>
    </div>
  </fieldset>

  <div class="preview"><strong id="previewLabel" data-i18n="preview">Preview</strong><output id="preview" aria-labelledby="previewLabel"></output></div>
  <label class="save-location"><input type="checkbox" id="saveAs"><span data-i18n="askSaveLocation">Ask where to save each file</span></label>
  <div class="save-row"><button id="save" type="button" data-i18n="saveSettings">Save settings</button><span id="status" role="status" aria-live="polite" aria-atomic="true"></span></div>
  <script src="localization.js"></script>
  <script src="options.js"></script>
</body>
</html>
